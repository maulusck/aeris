[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris"
dynamic = ["version"]
description = "AERIS · Avionic Ethernet Rig IP Selector — curses TUI for nmcli multi-IP management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["nmcli", "network", "ip", "tui", "curses", "ethernet"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
[project.scripts]
aeris = "aeris.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeris*"]

[tool.black]
line-length = 160
target-version = ["py312"]
