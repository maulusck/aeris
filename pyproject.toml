[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-ip-switcher"
version = "1.0.0"
description = "AERIS · Avionic Ethernet Rig IP Selector — curses TUI for nmcli multi-IP management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["nmcli", "network", "ip", "tui", "curses", "ethernet"]

[project.scripts]
aeris = "aeris.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeris*"]

[tool.black]
line-length = 160
target-version = ["py312"]